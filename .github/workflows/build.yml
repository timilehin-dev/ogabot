name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11 (Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore signing keystore
        env:
          OGABOT_KEYSTORE_BASE64: ${{ secrets.OGABOT_KEYSTORE_BASE64 }}
          OGABOT_KEYSTORE_PASSWORD: ${{ secrets.OGABOT_KEYSTORE_PASSWORD }}
          OGABOT_KEY_ALIAS: ${{ secrets.OGABOT_KEY_ALIAS }}
        run: |
          if [ -n "$OGABOT_KEYSTORE_BASE64" ]; then
            echo "$OGABOT_KEYSTORE_BASE64" | base64 -d > "$HOME/ogabot.keystore"
            echo "OGABOT_KEYSTORE_PATH=$HOME/ogabot.keystore" >> "$GITHUB_ENV"
          else
            echo "No keystore secret set; falling back to ephemeral debug signing"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ogabot-debug
          path: app/build/outputs/apk/debug/app-debug.apk
